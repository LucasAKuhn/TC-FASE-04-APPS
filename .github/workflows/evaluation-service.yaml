name: 🚀 CI/CD Pipeline - Evaluation Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'evaluation-service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'evaluation-service/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: evaluation-service
  AWS_REGION: ${{ vars.AWS_REGION }}
  GO_VERSION: '1.22'

jobs:
  build-test-sast:
    name: 🛠️ Build, Test & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_NAME }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔧 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_NAME }}/go.sum
      - name: 📦 Baixar dependências (go mod tidy)
        run: go mod tidy
      - name: 🔍 Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: ${{ env.APP_NAME }}
          args: --timeout=3m
      - name: 🧪 Testes Unitários
        run: go test -v ./... || echo "Nenhum teste encontrado, prosseguindo."
      - name: 🛡️ SAST (Gosec)
        uses: securego/gosec@master
        with:
          args: -severity high -exclude-dir=tests ./... 
      - name: Debug Path
        run: |
          echo "O valor de APP_NAME é: ${{ env.APP_NAME }}"
          ls -R
      - name: 🔍 Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.APP_NAME }}/dockerfile
          failure-threshold: error

  sca-dependency-scan:
    name: 📦 Scan de Dependências (SCA)
    runs-on: ubuntu-24.04
    needs: build-test-sast
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔍 Scan Trivy (Modo FS)
        uses: aquasecurity/trivy-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:2
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.APP_NAME }}'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: 0

  docker-build-scan-push:
    name: 🐳 Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: sca-dependency-scan
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔑 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 🔐 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: 🏗️ Build da Imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: | 
          docker build -t $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.APP_NAME }}:latest ${{ env.APP_NAME }}
          echo "image_name=$ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG" >> $GITHUB_ENV
      - name: 🛡️ Container Scan (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.image_name }}'
          severity: 'CRITICAL'
          exit-code: 0
      - name: 🚀 Push para o ECR
        if: success()
        run: |
          docker push ${{ env.image_name }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:latest
      - name: 🤖 Atualiza Manifestos K8s (GitOps - Cross-Repo)
        if: success()
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          git clone https://x-access-token:${GITOPS_PAT}@github.com/LucasAKuhn/TC-FASE-04-GITOPS.git /tmp/gitops
          sed -i "s|image: .*$|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}|g" /tmp/gitops/k8s/04-evaluation.yaml
          cd /tmp/gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/04-evaluation.yaml
          git commit -m "cd: atualização de tag da imagem ${{ env.APP_NAME }} para a versão ${{ github.sha }}" || echo "Nenhuma mudança a commitar"
          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
      - name: 📊 Resumo do Pipeline
        run: |
          echo "## 🚀 Resumo do Deploy - ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Serviço**: ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag da Imagem**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Scans de Segurança**: ✅ Concluídos e Aprovados" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps Repo**: TC-FASE-04-GITOPS (cross-repo update)" >> $GITHUB_STEP_SUMMARY
