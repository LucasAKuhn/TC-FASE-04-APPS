name: 🚀 CI/CD Pipeline - Flag Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'flag-service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'flag-service/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: flag-service 
  AWS_REGION: ${{ vars.AWS_REGION }}
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Build, Testes e Análise Estática (SAST)
  build-test-sast:
    name: 🛠️ Setup, Lint & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_NAME }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependências e ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest

      - name: 🔍 Linter (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Testes Unitários (Pytest)
        run: pytest || echo "Nenhum teste encontrado, prosseguindo."

      - name: 🛡️ SAST (Bandit)
        run: bandit -r . -lll # Avalia falhas de alta severidade no código Python

      - name: 🔍 Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.APP_NAME }}/dockerfile
          failure-threshold: error

  # Job 2: Scan de Dependências (SCA)
  sca-dependency-scan:
    name: 📦 Scan de Dependências (SCA)
    runs-on: ubuntu-latest
    needs: build-test-sast
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Scan Trivy (Modo FS)
        uses: aquasecurity/trivy-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:2
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.APP_NAME }}'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: 1 # 1 bloqueia o pipeline em vulnerabilidades CRITICAL/HIGH

  # Job 3: Construção da Imagem, Container Scan e Push
  docker-build-scan-push:
    name: 🐳 Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: sca-dependency-scan
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build da Imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: | 
          echo "Construindo a imagem para o repositório $ECR_REGISTRY/${{ env.APP_NAME }}..."
          docker build -t $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.APP_NAME }}:latest ${{ env.APP_NAME }}
          echo "image_name=$ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: 🛡️ Container Scan (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.image_name }}'
          severity: 'CRITICAL'
          exit-code: 1 # 1 bloqueia o pipeline em vulnerabilidades CRITICAL

      - name: 🚀 Push para o ECR
        if: success()
        run: |
          docker push ${{ env.image_name }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:latest

      - name: 🤖 Atualiza Manifestos K8s (GitOps - Cross-Repo)
        if: success()
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          # Clone o repo de manifestos K8s (GitOps)
          git clone https://x-access-token:${GITOPS_PAT}@github.com/julianopoklen/TC-FASE-04-GITOPS.git /tmp/gitops

          # Atualiza a imagem no manifesto correto
          sed -i "s|image: .*$|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}|g" /tmp/gitops/k8s/02-flag.yaml

          # Commit e push no repo GitOps
          cd /tmp/gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/02-flag.yaml
          git commit -m "cd: atualização de tag da imagem ${{ env.APP_NAME }} para a versão ${{ github.sha }}" || echo "Nenhuma mudança a commitar"

          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

      - name: 📊 Resumo do Pipeline
        run: |
          echo "## 🚀 Resumo do Deploy - ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Serviço**: ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag da Imagem**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Scans de Segurança**: ✅ Concluídos e Aprovados" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps Repo**: TC-FASE-04-GITOPS (cross-repo update)" >> $GITHUB_STEP_SUMMARY
